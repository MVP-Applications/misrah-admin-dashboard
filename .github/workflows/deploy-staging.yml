name: Deploy to Staging

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          # Same API host used for local dev (https://misra-test.mvp-apps.ae) — there is
          # no separate staging API, confirmed with the project owner. VITE_API_KEY is
          # not treated as a secret at runtime (it ends up in the public JS bundle
          # either way — see API_INTEGRATION.md), but is still read from a GitHub
          # Actions secret rather than committed here. Add a repo secret named
          # VITE_API_KEY with the same value used in your local .env before this
          # workflow can build a working staging deploy.
          VITE_API_BASE_URL: https://misra-test.mvp-apps.ae
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: npm run build

      - name: Deploy over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/mvp-server/misrah-admin-dashboard-staging
          remote_host: ${{ secrets.STAGING_HOST }}
          remote_user: ${{ secrets.STAGING_USER }}
          remote_key: ${{ secrets.STAGING_SSH_KEY }}
          remote_port: ${{ secrets.STAGING_PORT }}
