name: Deploy to Staging

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          # Same API host used for local dev (https://misra-test.mvp-apps.ae) — there is
          # no separate staging API, confirmed with the project owner. VITE_API_KEY is
          # read from a repository VARIABLE (not a Secret) — it's not sensitive at
          # runtime (it ends up in the public JS bundle either way, see
          # API_INTEGRATION.md), so GitHub's own plaintext `vars` store is the
          # semantically correct place for it, not the encrypted `secrets` store.
          # Set at: repo Settings → Secrets and variables → Actions → Variables tab.
          VITE_API_BASE_URL: https://misra-test.mvp-apps.ae
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Password auth via sshpass — burnett01/rsync-deployments only supports keys.
      # SSHPASS is read by `sshpass -e` so the password never appears on the command line.
      - name: Deploy over SSH
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          sshpass -e rsync -avzr --delete \
            -e "ssh -p $STAGING_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            dist/ "$STAGING_USER@$STAGING_HOST:/home/mvp-server/misrah-admin-dashboard-staging"
